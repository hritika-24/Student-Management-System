<!DOCTYPE html>
<html xmlns:th="http:www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
	crossorigin="anonymous">
</head>
<body>
	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
		<!-- brand -->
		<a class="navbar-brand" href="#">Student Management System</a>

		<!-- toggler /collapsible button -->

		<button class="navbar-toggler" type="button" data-toggle="collapse"
			data-target="colapsibleNavbar">
			<span class="navbar-togggler-icon"></span>
		</button>

		<!-- navbar links -->
		<div class="collapse navbar-collapse" id="collapsibleNavbar">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" th:href="@{/students}">Student
						Management</a></li>
			</ul>
		</div>




	</nav>
















	<div class="container">
		<div class="text-center">


			<h2>Student List</h2>
		</div>

		<div class="row">

			<div class="col-lg-3">
				<a th:href="@{/students/new}" class="btn btn-primary btn-sm mb-3">Add
					Student</a>


			</div>
		</div>
	</div>




	<h2 class="text-center">Students List</h2>
	<table class="table table-stripped table-bordered">
		<thead>
			<tr>

				<th>First Name</th>
				<th>Middle Name</th>
				<th>Last Name</th>
				<th>Date Of the Birth</th>
				<th>Age</th>
				<th>Gender</th>
				<th>Address</th>
				<th>Mobile Number</th>
				<th>Action</th>
				
			</tr>

			<thead><tbody>
			<tr th:each="student:${students}"><td th:text="${student.firstname}"></td>
			<td th:text="${student.middlename}"></td>
			<td th:text="${student.lastname}"></td>
			<td th:text="${#temporals.format(student.dob,'dd/MM/yyyy')}"></td>
			<td th:text="${student.age}"></td>
			<td th:text="${student.gender}"></td>
			<td th:text="${student.address}"></td>
			<td th:text="${student.mobile_no}"></td>
			<td><a th:href="@{students/edit/{id}(id=${student.id})}" class="btn btn-info">Update</a>
			
			<a th:href="@{students/{id}(id=${student.id})}" class="btn btn-danger">Delete</a>
			
			
			
			</td>




			</tr>
		
		</tbody>
	</table>
</body>
</html>
