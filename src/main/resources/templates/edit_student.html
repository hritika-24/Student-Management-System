<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Student Registration Form</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
<!-- Custom CSS -->
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-md bg-dark navbar-dark">
		<!-- brand -->
		<a class="navbar-brand" href="#">Student Management System</a>

		<!-- toggler /collapsible button -->

		<button class="navbar-toggler" type="button" data-toggle="collapse"
			data-target="colapsibleNavbar">
			<span class="navbar-togggler-icon"></span>
		</button>

		<!-- navbar links -->
		<div class="collapse navbar-collapse" id="collapsibleNavbar">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" th:href="@{/students}">Student
						Management</a></li>
			</ul>
		</div>




	</nav>


    <!-- Container for the form -->
    <div class="container mt-5 p-4 rounded" style="max-width: 600px; background-color: #f9f9f9; box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.1);">

        <h2 class="text-center text-primary mb-4">Update Student</h2>
        
        <form th:action="@{/students/edit/{id}(id=${student.id})}" th:object="${student}" method="post">
            
            <!-- First Name -->
            <div class="mb-3">
                <label for="firstname" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstname" name="firstname" placeholder="Enter First Name" th:field="*{firstname}" required>
            </div>

            <!-- Middle Name -->
            <div class="mb-3">
                <label for="middlename" class="form-label">Middle Name</label>
                <input type="text" class="form-control" id="middlename" name="middlename" placeholder="Enter Middle Name"  th:field="*{middlename}">
            </div>

            <!-- Last Name -->
            <div class="mb-3">
                <label for="lastname" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastname" name="lastname" placeholder="Enter Last Name"   th:field="*{lastname}"required>
            </div>

            <!-- Date of Birth -->
            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" class="form-control" id="dob" name="dob"    th:field="*{dob}" required>
            </div>

            <!-- Age -->
            <div class="mb-3">
                <label for="age" class="form-label">Age</label>
                <input type="text" class="form-control" id="age" name="age" placeholder="Enter Age"   th:field="*{age}" required>
            </div>

            <!-- Gender -->
            <div class="mb-3">
                <label for="gender" class="form-label">Gender</label>
                <input type="text" class="form-control" id="gender" name="gender" placeholder="Enter Gender" th:field="*{gender}"required>
            </div>

            <!-- Address -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="address" placeholder="Enter Address" th:field="*{address}" required>
            </div>

            <!-- Mobile Number -->
            <div class="mb-3">
                <label for="mobile_no" class="form-label">Mobile Number</label>
                <input type="text" class="form-control" id="mobile_no" name="mobile_no" placeholder="Enter Mobile Number"   th:field="*{mobile_no}" required>
            </div>

            <!-- Submit Button -->
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary btn-lg">Update</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0U8Iebv74k14swz78nG8V02sc8cW0A0ZAgtoTtiogtnodptM" crossorigin="anonymous"></script>
</body>
</html>
